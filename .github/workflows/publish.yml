# Publish workflow for the three MACF npm packages.
#
# Operator prerequisites (required before the first `v*` tag push; set
# up once, then forgotten). See DR-022 for background:
#
#   1. `groundnuty` user or org exists on npmjs.com owning the
#      `@groundnuty/*` scope. (In practice: the existing `groundnuty`
#      user account's personal scope — no org created, per science-
#      agent's 2026-04-22 operator-prereq note on #206.)
#
#   2. One of two authentication paths configured:
#      a) OIDC trusted publisher on EACH of the three packages'
#         npmjs.com settings pages pointing at this repo + this
#         workflow file. Preferred; gives provenance attestations.
#         Only available AFTER each package exists on npm (chicken-
#         and-egg), so the bootstrap publish uses path (b).
#      b) `NPM_TOKEN` granular access token scoped to `@groundnuty/*`
#         with publish permission, provisioned as a repo secret.
#         Works for the bootstrap publish + as a fallback if OIDC
#         breaks.
#
#   3. TODO(operator): enable 2FA on the groundnuty npm account once
#      initial publishes settle (currently deferred per #206 operator
#      note). Add the `publish` 2FA level at the account level and
#      `auth-and-writes` for granular tokens. Doesn't require a
#      workflow change — but the existing `NPM_TOKEN` will need
#      regenerating as an `auth-and-writes` token when flipped.
#
# Publish ordering:
#
#   core first, then consumers (CLI + channel-server). Consumer
#   tarballs reference `@groundnuty/macf-core@<version>` as a
#   concrete dep, so core MUST be live on npm before a consumer can
#   install cleanly. Sequential steps gate this — a failed core step
#   prevents consumer publishes, avoiding half-published releases.
#
# Rollback:
#
#   Within 72h of publish: `npm unpublish @groundnuty/macf-*@<version>`
#   is allowed. Past 72h: only deprecate + patch. Verification on all
#   three agent workspaces should complete within the 72h window per
#   DR-022 Amendment H.

name: Publish

on:
  push:
    tags: ['v*']
  # Manual dispatch for one-off re-runs (e.g. rotation tests, rc
  # verification). Doesn't create a tag — operator runs against the
  # current checkout. Default to dry-run for safety.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run npm publish --dry-run only (no actual publish)'
        required: false
        type: boolean
        default: true

# `id-token: write` is required for OIDC provenance. `contents: read`
# for the checkout. Scoped to the minimum; nothing else on the
# repo's default GITHUB_TOKEN needs write access for this workflow.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Run from a tag ref only — never a branch push — as a defensive
    # layer. The on.push.tags trigger already restricts this, but
    # refs/heads/* sneaking through (e.g. via workflow_dispatch on a
    # branch) would publish from unreviewed code. Explicit guard.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v7

      # Retrying wrapper around jetify-com/devbox-install-action@v0.15.0 —
      # its unconditional Nix-installer download 503s intermittently
      # against an upstream unrelated to the devbox-version pin below.
      # See .github/actions/devbox-install/action.yml + macf#879.
      - uses: ./.github/actions/devbox-install
        with:
          devbox-version: '0.16.0'  # pin: 0.17.x ships a require()-in-ESM helper that crashes in our "type":"module" repo (no-floating-tags directive)

      - name: Derive version from tag or package.json
        id: version
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          # Tag form: refs/tags/v0.2.0 → version 0.2.0
          # For workflow_dispatch on a branch, use package.json.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag_driven=true" >> "$GITHUB_OUTPUT"
          else
            PKG_VERSION=$(node -p "require('./packages/macf-core/package.json').version")
            echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag_driven=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check package.json versions match the tag
        if: steps.version.outputs.tag_driven == 'true'
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          # Lock-step per DR-022 Amendment D — all three packages
          # publish at the same version. Fail loud if any package.json
          # drifts from the tag version before a single publish runs.
          set -e
          for pkg in macf-core macf macf-channel-server; do
            ACTUAL=$(node -p "require('./packages/${pkg}/package.json').version")
            if [[ "$ACTUAL" != "$EXPECTED" ]]; then
              echo "::error::packages/${pkg}/package.json version=${ACTUAL} doesn't match tag v${EXPECTED}"
              exit 1
            fi
          done
          echo "All three packages at v${EXPECTED}, matches tag."

      - name: Check marketplace plugin.json version matches the tag (macf#426)
        if: steps.version.outputs.tag_driven == 'true'
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          # macf#426 version-lockstep: the marketplace repo is the canonical
          # source for the mountable plugin (manifest + skills/agents/hooks);
          # `macf init`/`update` fetch it at `v<version>`. If it lags npm (as it
          # did — stuck at 0.2.26 / 0.2.33 behind shipping versions), consumers
          # `macf update` to a plugin tag older than the npm packages. Fail the
          # release loud BEFORE publishing if the marketplace plugin.json at the
          # release tag is missing or version-mismatched — forcing the
          # marketplace bump + tag to land first.
          set -euo pipefail
          URL="https://raw.githubusercontent.com/groundnuty/macf-marketplace/v${EXPECTED}/macf-agent/.claude-plugin/plugin.json"
          HTTP=$(curl -sS -w '%{http_code}' -o /tmp/mp-plugin.json "$URL")
          if [[ "$HTTP" != "200" ]]; then
            echo "::error::marketplace macf-agent/.claude-plugin/plugin.json not found at tag v${EXPECTED} (HTTP ${HTTP}). Bump + tag groundnuty/macf-marketplace to v${EXPECTED} before releasing."
            exit 1
          fi
          MP_VERSION=$(node -p "require('/tmp/mp-plugin.json').version")
          if [[ "$MP_VERSION" != "$EXPECTED" ]]; then
            echo "::error::marketplace plugin.json version=${MP_VERSION} doesn't match release tag v${EXPECTED}. Bump groundnuty/macf-marketplace to v${EXPECTED}."
            exit 1
          fi
          echo "marketplace plugin.json at v${EXPECTED} matches — lockstep OK."

      # Sigstore's transparency log is append-only; once an entry is
      # submitted, retrying the same tarball content gets 409
      # TLOG_CREATE_ENTRY_ERROR. A prior partially-failed publish run
      # can leave one or two packages on npm at the target version
      # while a third never made it (the third's TLOG entry was
      # registered, but the npm publish failed downstream). Retrying
      # the same tag THEN trips the 409 on the previously-failed
      # package — producing a structurally broken split-publish.
      # Catch this BEFORE any publish step runs: query npm for each
      # package's current latest version; if any matches the target,
      # fail loud and require a human to bump + retag. Recovery
      # procedure documented in DR-022 Amendment L. Witness incident:
      # v0.2.25 -> v0.2.26 cycle on 2026-05-18 (macf#377).
      # Skipped on dry-run (no real publish happens; pre-flight check
      # would block valid dry-run iteration on existing versions).
      - name: Pre-flight registry collision check (sigstore TLOG race defense)
        if: steps.version.outputs.tag_driven == 'true' && github.event.inputs.dry-run != 'true'
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          set -e
          ANY_COLLISION=0
          for pkg in macf-core macf macf-channel-server; do
            FULL="@groundnuty/${pkg}"
            URL="https://registry.npmjs.org/${FULL}"
            CURRENT=""
            for try in 1 2 3; do
              if META=$(curl -sfL "$URL" 2>/dev/null); then
                CURRENT=$(echo "$META" | jq -r '.["dist-tags"].latest // empty')
                break
              fi
              sleep 2
            done
            if [[ -z "$CURRENT" ]]; then
              echo "OK ${FULL}: never-published (no current latest)"
              continue
            fi
            if [[ "$CURRENT" == "$EXPECTED" ]]; then
              echo "::error::${FULL}@${EXPECTED} is ALREADY at the target version on npm -- refusing to retry."
              echo "::error::Likely cause: a prior publish run partially succeeded (sigstore TLOG race during retry-by-tag-recreate)."
              echo "::error::Recovery: bump all three packages to the next patch version + re-tag + push. See DR-022 Amendment L."
              ANY_COLLISION=1
            else
              echo "OK ${FULL}: current latest=${CURRENT}, target=${EXPECTED} (no collision)"
            fi
          done
          if [[ "$ANY_COLLISION" == "1" ]]; then
            exit 1
          fi
          echo "Pre-flight clean -- no version collisions; safe to publish v${EXPECTED}."

      - name: Install + check + build
        run: |
          devbox run -- npm ci
          devbox run -- make -f dev.mk check
          devbox run -- make -f dev.mk build

      # macf#605: the marketplace `macf-agent/` tree is distributed verbatim to
      # consumers by `macf init`/`update` (shallow-clone of the marketplace, see
      # plugin-fetcher.ts) — NOT copied from this monorepo. So it must stay
      # byte-identical to the canonical `packages/macf/plugin/` across the synced
      # subdirs (agents/hooks/scripts/skills). It silently drifted once: a stale
      # v0.2.0-era hooks.json (missing the #571 turn-state hooks) + a missing
      # scripts/ dir left `/health.state` dark on consumers. The macf#426 check
      # above only compares the plugin.json VERSION; this gate compares the
      # FILE CONTENT. Fail the release loud BEFORE publishing if the marketplace
      # at the release tag has drifted — forcing a re-sync + marketplace re-tag.
      #
      # Runs right after "Install + check + build" so it reuses that step's
      # compiled dist (dist/cli/marketplace-sync.js, which the .mjs imports) —
      # no redundant `npm ci` — and stays before any publish step. (Drift is the
      # rare path; failing ~here instead of in the pre-precheck cluster trades a
      # slightly later failure for zero redundant install on every green release.)
      - name: Sync gate — marketplace macf-agent/ must match canonical plugin/ (macf#605)
        if: steps.version.outputs.tag_driven == 'true'
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Shallow-clone the marketplace at the release tag (macf#426 above
          # already verified the tag + plugin.json exist; dist was built by the
          # "Install + check + build" step above).
          MP_DIR="$(mktemp -d)"
          git clone --depth 1 --branch "v${EXPECTED}" \
            https://github.com/groundnuty/macf-marketplace "$MP_DIR"
          if ! node packages/macf/scripts/sync-marketplace-plugin.mjs \
                 --check --target "$MP_DIR/macf-agent"; then
            echo "::error::marketplace macf-agent/ has drifted from canonical packages/macf/plugin/ (mismatches above)."
            echo "::error::Re-sync: node packages/macf/scripts/sync-marketplace-plugin.mjs --target <macf-marketplace-checkout>/macf-agent"
            echo "::error::then commit + tag groundnuty/macf-marketplace at v${EXPECTED} before re-tagging this release. See macf#605."
            exit 1
          fi
          echo "marketplace macf-agent/ in sync with canonical plugin/ — OK."

      # OIDC trusted publishers (npm 11.5.1+) require a newer npm than
      # devbox's nixpkgs pin currently provides (npm@10.8.3 at the
      # nodePackages.npm pin). Install npm@11.14.1 into a user-writable
      # prefix on the runner ($HOME/npm-global) and prepend to PATH;
      # devbox.json's pin stays the same so local dev is unaffected.
      #
      # Why NOT `devbox run -- npm install -g`: devbox uses Nix's
      # read-only store at /nix/store/...; npm's default global prefix
      # under Nix's nodejs hits EACCES on mkdir. The user-prefix
      # approach uses the SAME devbox npm binary as the install driver
      # but redirects the install target to a writable location.
      #
      # PINNED to a specific npm version, NOT `latest`: floating tags
      # silently break in the future when npm 12+ ships behavioral
      # changes. Bump this pin explicitly when needed. See operator
      # directive 2026-05-20 (`feedback_no_floating_tags_in_ci_pins.md`).
      - name: Upgrade npm to 11.14.1 (for OIDC trusted publisher support)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/npm-global"
          devbox run -- npm config set prefix "$HOME/npm-global"
          devbox run -- npm install -g npm@11.14.1
          echo "$HOME/npm-global/bin" >> "$GITHUB_PATH"
          "$HOME/npm-global/bin/npm" --version

      - name: Detect auth path
        id: auth
        env:
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          # Prefer OIDC when id-token:write grants succeed (provenance
          # attestations generated by npm publish --provenance). Fall
          # back to NPM_TOKEN for the bootstrap publish (when the
          # package doesn't yet exist on npm and OIDC trust can't be
          # configured on it).
          if [[ "$HAS_NPM_TOKEN" == "true" ]]; then
            echo "npm_token_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_token_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure npm auth (NPM_TOKEN path)
        if: steps.auth.outputs.npm_token_available == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Write the token to ~/.npmrc for the duration of the job.
          # GitHub Actions runners are ephemeral; no cleanup needed.
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
          echo "registry=https://registry.npmjs.org/" >> "$HOME/.npmrc"

      # Bare `npm publish` (NOT `devbox run -- npm publish`) — uses the
      # PATH-resolved npm 11.14.1 from $HOME/npm-global/bin (installed
      # above) for OIDC trusted publisher support. devbox's pinned
      # npm@10.8.3 lacks the OIDC handshake (needs 11.5.1+).
      #
      # Workflow flag (not cwd) targets sub-packages from monorepo root.
      # `cd packages/<name>` before the command was a silent no-op
      # historically — npm packed the private monorepo-root package
      # instead of the intended sub-package, failing with EPRIVATE.
      # See v0.2.0-rc.0 failed publish run for the diagnostic.
      # Each publish step's own exit code IS the acceptance signal (macf#1297)
      # -- an `id` here is what lets the acceptance-summary + availability
      # steps below read `outcome` per package without re-fetching the
      # registry to find out what already happened.
      - name: Publish @groundnuty/macf-core (first, consumers depend on it)
        id: publish_core
        env:
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --workspace=@groundnuty/macf-core --provenance --access public --dry-run
          else
            npm publish --workspace=@groundnuty/macf-core --provenance --access public
          fi

      - name: Publish @groundnuty/macf (CLI)
        id: publish_cli
        env:
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --workspace=@groundnuty/macf --provenance --access public --dry-run
          else
            npm publish --workspace=@groundnuty/macf --provenance --access public
          fi

      - name: Publish @groundnuty/macf-channel-server
        id: publish_channel_server
        env:
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --workspace=@groundnuty/macf-channel-server --provenance --access public --dry-run
          else
            npm publish --workspace=@groundnuty/macf-channel-server --provenance --access public
          fi

      # macf#1297: this step used to conflate two different questions —
      #
      #   ACCEPTANCE     did npm accept the publish?      IMMEDIATE, known
      #                                                    from the publish
      #                                                    step's own exit
      #                                                    code, above.
      #   AVAILABILITY   can the registry SERVE it yet?   EVENTUALLY
      #                                                    CONSISTENT, only
      #                                                    knowable by
      #                                                    fetching.
      #
      # A ~15s fetch-retry budget (5 tries x 3s) treated a not-yet-visible
      # fetch as a failed publish -- the inverted silent-fallback shape,
      # failure reported for success. That fired on v0.2.58 (~90s observed
      # registry lag on the third package -- see #776's comment thread).
      #
      # Split into two steps below:
      #   1. "Publish acceptance summary" -- reads each publish step's own
      #      `outcome` (no registry access at all) and names, per package,
      #      ACCEPTED / REJECTED / NOT ATTEMPTED. This is also the
      #      partial-publish-awareness signal silent-fallback-hazards.md
      #      Instance 9 calls for: when a publish step fails mid-sequence,
      #      the packages before it already landed and the ones after it
      #      never ran -- DR-022 Amendment L's bump-version recovery needs
      #      exactly this list to be decidable.
      #   2. "Verify registry availability + provenance" -- a BOUNDED
      #      fetch-retry (attempt-count bound, never a CI/job timeout —
      #      see #1295, which hit the identical shape on release.sh's side
      #      and settled on this same budget) that reports lag as lag, and
      #      only fails the job on a GENUINE defect: a package that IS
      #      available but was published without the provenance attestation
      #      it was supposed to carry (macf#214).
      #
      # A REJECTED package already fails the job via its own publish
      # step's exit code, unchanged by this split — that safety net was
      # never the conflated part.
      - name: Publish acceptance summary (per-package, from each publish step's own result)
        if: ${{ !cancelled() && github.event.inputs.dry-run != 'true' }}
        continue-on-error: true # diagnostic only -- never the failure gate; see comment above
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OUTCOME_CORE: ${{ steps.publish_core.outcome }}
          OUTCOME_CLI: ${{ steps.publish_cli.outcome }}
          OUTCOME_CHANNEL_SERVER: ${{ steps.publish_channel_server.outcome }}
        run: |
          set -euo pipefail
          ANY_REJECTED=0
          for entry in \
            "@groundnuty/macf-core:${OUTCOME_CORE}" \
            "@groundnuty/macf:${OUTCOME_CLI}" \
            "@groundnuty/macf-channel-server:${OUTCOME_CHANNEL_SERVER}"
          do
            pkg="${entry%%:*}"
            outcome="${entry#*:}"
            case "$outcome" in
              success)
                echo "ACCEPTED       ${pkg}@${VERSION} -- npm accepted this publish (from the publish step's own exit code)."
                ;;
              skipped)
                echo "NOT ATTEMPTED  ${pkg}@${VERSION} -- never published this run (an earlier package's publish step failed first)."
                ;;
              *)
                echo "REJECTED       ${pkg}@${VERSION} -- npm rejected this publish (publish step outcome=${outcome})."
                ANY_REJECTED=1
                ;;
            esac
          done
          if [ "$ANY_REJECTED" = "1" ]; then
            echo "::error::At least one package was REJECTED by npm this run. See the ACCEPTED / NOT ATTEMPTED / REJECTED lines above for exactly which packages landed -- that is what makes DR-022 Amendment L's bump-version recovery decidable (silent-fallback-hazards.md Instance 9)."
          fi

      - name: Verify registry availability + provenance (bounded; a lag is NOT a publish failure)
        if: ${{ !cancelled() && github.event.inputs.dry-run != 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OUTCOME_CORE: ${{ steps.publish_core.outcome }}
          OUTCOME_CLI: ${{ steps.publish_cli.outcome }}
          OUTCOME_CHANNEL_SERVER: ${{ steps.publish_channel_server.outcome }}
          NPM_TOKEN_AVAILABLE: ${{ steps.auth.outputs.npm_token_available }}
        run: |
          set -euo pipefail
          # Bound is asserted by ATTEMPT COUNT, never by the job/CI
          # timeout (#1295 flagged exactly this: a timeout-derived bound
          # weakens silently if the timeout is ever raised for an
          # unrelated reason, and `exit 124` is indistinguishable from
          # infra flake). 8 attempts, 5s/10s/20s/40s/60s-capped backoff
          # (~4m15s worst case) matches release.sh's `wait_for_npm_version`
          # (#1295) -- one release-verify convention, not two.
          MAX_TRIES=8
          BASE_SECS=5
          CAP_SECS=60

          ANY_PROVENANCE_MISSING=0
          for entry in \
            "@groundnuty/macf-core:${OUTCOME_CORE}" \
            "@groundnuty/macf:${OUTCOME_CLI}" \
            "@groundnuty/macf-channel-server:${OUTCOME_CHANNEL_SERVER}"
          do
            pkg="${entry%%:*}"
            outcome="${entry#*:}"

            if [ "$outcome" != "success" ]; then
              echo "SKIP  ${pkg}@${VERSION} -- not accepted this run (publish step outcome=${outcome}); nothing to check availability of."
              continue
            fi

            URL="https://registry.npmjs.org/${pkg}/${VERSION}"
            META=""
            attempt=1
            while [ "$attempt" -le "$MAX_TRIES" ]; do
              if META="$(curl -sfL "$URL" 2>/dev/null)"; then
                break
              fi
              META=""
              if [ "$attempt" -lt "$MAX_TRIES" ]; then
                delay=$((BASE_SECS * (1 << (attempt - 1))))
                if [ "$delay" -gt "$CAP_SECS" ]; then
                  delay="$CAP_SECS"
                fi
                echo "LAG  ${pkg}@${VERSION} not yet visible on the registry (attempt ${attempt}/${MAX_TRIES}) -- npm already ACCEPTED this publish (see the acceptance summary above); this is replication lag, not a failure. Retrying in ${delay}s..."
                sleep "$delay"
              fi
              attempt=$((attempt + 1))
            done

            if [ -z "$META" ]; then
              echo "::warning::AVAILABILITY UNCONFIRMED for ${pkg}@${VERSION} after ${MAX_TRIES} attempts -- npm already ACCEPTED this publish, so this is NOT a publish failure. Confirm manually once convenient: npm view ${pkg}@${VERSION}"
              continue
            fi

            if [ "$attempt" -gt 1 ]; then
              echo "AVAILABLE  ${pkg}@${VERSION} on the registry (after ${attempt}/${MAX_TRIES} attempts -- some replication lag, as expected)."
            else
              echo "AVAILABLE  ${pkg}@${VERSION} on the registry (first attempt, no lag)."
            fi

            if [ "$NPM_TOKEN_AVAILABLE" = "true" ]; then
              echo "  (provenance check skipped -- this run used the NPM_TOKEN bootstrap path, which does not generate attestations)"
              continue
            fi

            # macf#214: npm publish --provenance has historically exited 0
            # while silently skipping attestation generation (missing
            # id-token:write, wrong OIDC scope). This is a GENUINE defect,
            # distinct from lag -- the package IS available above, so
            # absence here means "published without the provenance we
            # required", not "not yet visible".
            #
            # Attestation shape (verified 2026-05-20 against the registry):
            #   dist.attestations = {
            #     url: "https://registry.npmjs.org/-/npm/v1/attestations/<scope>%2f<pkg>@<version>",
            #     provenance: { predicateType: "https://slsa.dev/provenance/v1" }
            #   }
            if echo "$META" | jq -e '.dist.attestations.url' >/dev/null 2>&1; then
              ATT_URL=$(echo "$META" | jq -r '.dist.attestations.url')
              echo "  provenance attestation present: ${ATT_URL}"
            else
              echo "::error::PROVENANCE MISSING for ${pkg}@${VERSION} -- the package IS available on the registry, but npm published it without a provenance attestation (dist.attestations: $(echo "$META" | jq -c '.dist.attestations // null')). This is a genuine failure, not a lag -- see macf#214."
              ANY_PROVENANCE_MISSING=1
            fi
          done

          if [ "$ANY_PROVENANCE_MISSING" = "1" ]; then
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
          NPM_TOKEN_AVAILABLE: ${{ steps.auth.outputs.npm_token_available }}
        run: |
          AUTH_PATH="OIDC-only"
          if [[ "$NPM_TOKEN_AVAILABLE" == "true" ]]; then
            AUTH_PATH="NPM_TOKEN + OIDC provenance"
          fi
          {
            echo "## Publish run summary"
            echo ""
            echo "- Version: \`v$VERSION\`"
            echo "- Dry run: \`$DRY_RUN\`"
            echo "- Auth path: $AUTH_PATH"
            echo ""
            echo "### Published packages (if not dry-run)"
            echo "- [@groundnuty/macf-core@$VERSION](https://www.npmjs.com/package/@groundnuty/macf-core/v/$VERSION)"
            echo "- [@groundnuty/macf@$VERSION](https://www.npmjs.com/package/@groundnuty/macf/v/$VERSION)"
            echo "- [@groundnuty/macf-channel-server@$VERSION](https://www.npmjs.com/package/@groundnuty/macf-channel-server/v/$VERSION)"
          } >> "$GITHUB_STEP_SUMMARY"
