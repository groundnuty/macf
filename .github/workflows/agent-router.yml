name: Agent Router

# Delegates to the reusable workflow in groundnuty/macf-actions@v3.4.2
# (see https://github.com/groundnuty/macf-actions for source).
#
# Stage-3 (registry-driven mTLS channels) per DR-027 (ratified) — supersedes
# the #273 permanent-Stage-2 directive. The router resolves each agent's
# host+port from the MACF registry (profile scope: `groundnuty` is a user
# account, so the registry lives at groundnuty/groundnuty per DR-006) and
# POSTs `issue_routed` to the agent's channel server over mTLS, instead of
# the v1.x SSH/tmux inject. Mirrors the devops-toolkit caller (flipped
# 2026-06-25, devops-toolkit#112). Revert is a one-line pin flip
# @v3.4.1 -> @v1.3.4 (the v1.x SSH path stays available). See macf#562.
#
# Pinned to immutable v3.4.1 rather than the floating @v3 tag so the
# routing infrastructure macf itself depends on doesn't move without
# an explicit PR here. When macf-actions cuts a new release, upgrade
# the `uses:` ref by a dedicated PR on this repo — that gives the
# upgrade its own review+verify window.

on:
  issues:
    types: [labeled, closed]
  issue_comment:
    types: [created]
  # macf#980: `synchronize` + `ready_for_review` added alongside `opened`. A
  # PR opened while `mergeStateStatus: DIRTY` produces ZERO workflow runs at
  # all (GitHub can't build the merge ref `pull_request` events test), so
  # `opened` — the only trigger before this fix — is unreachable for that
  # PR's whole life; a later force-push only emits `synchronize`, which
  # wasn't subscribed. `ready_for_review` closes the parallel draft→ready
  # gap (#942's disclosure ladder recommends opening a PR as `--draft`,
  # and a draft marked ready never routed either). See the `gate` job below
  # for the notification-storm suppression this addition requires.
  pull_request:
    types: [opened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]
  # Also feeds route-by-pr-review-state (macf-actions#432, v1.3.2+): an
  # approved / changes_requested review notifies the PR author in their
  # tmux session, so a `gh pr review` reaches the implementer without a
  # manual @mention. No `on:`/permissions change — already declared above.
  # CI-completion routing (macf-actions#6, v1.3+). Fires the
  # route-by-ci-completion job so agent-authored PRs get notified
  # when CI finishes, eliminating the "post handoff + poll" pattern.
  check_suite:
    types: [completed]

# Caller must grant at least what the reusable workflow expects.
# `checks: read` is required for the CI-completion job to enumerate
# check_runs (for the first-failing-check name) — without it the job
# would 403 inside the reusable workflow.
permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

jobs:
  # ─── ROUTE GATE (macf#980) ───
  # `synchronize` fires on EVERY push to the PR head, and `route-by-mention`
  # (inside the reusable workflow) re-scans the PR body for @mentions on
  # every `pull_request` event with no action-type discrimination — so a
  # naive, unconditional `synchronize` subscription would re-notify the
  # reviewer on every push during ordinary review iteration. Worse than the
  # bug it fixes. This gate restores RECOVERY-ONLY semantics for
  # `synchronize`: route only when NO prior pull_request-triggered "Agent
  # Router" run exists for the PR's head branch — mirroring the operator's
  # own diagnostic (`gh run list --workflow "Agent Router" --json
  # event,headBranch --jq 'select(.headBranch=="<branch>")'`). A rebase that
  # resolves the DIRTY state (or any push that is the FIRST to reach a valid
  # merge ref) is then the natural, self-healing recovery.
  #
  # `opened` and `ready_for_review` are NOT gated on prior-run recovery
  # semantics — they always route unconditionally (same as `opened` did
  # before macf#980), UNLESS the actor is `dependabot[bot]` (see the ACTOR
  # check below, which applies uniformly across every `pull_request`
  # action). Gating `ready_for_review` on "no prior run" would wrongly
  # suppress it whenever `opened` already fired for that PR — which it
  # does today even for draft PRs (route-by-mention doesn't discriminate
  # on draft state), so a question-carrying draft (per #942) would still
  # be silenced at the exact moment (`ready_for_review`) this fix exists
  # to unblock.
  #
  # Also closes a Dependabot-authored `pull_request` exposure
  # (groundnuty/macf#1363): the caller's `secrets:` block fails the
  # reusable-workflow CALL OUTRIGHT for Dependabot-authored pull_request
  # events (Dependabot PRs get an EMPTY secrets context by GitHub design —
  # a security control, not a misconfiguration), so `route:` fails at
  # composition ("Secret X is required, but not provided") before any job
  # body runs — a red X on a PR whose actual `check` may be perfectly
  # green. An earlier pass at this (macf#980) scoped the ACTOR check to
  # non-`opened` actions only and left `opened` exposed; macf#1363 closed
  # that gap after six Dependabot PRs sat unreviewed for months behind the
  # false-red signal, with exactly one of the six failing on its own
  # merits (#174, a genuine TypeScript 6.0 incompatibility).
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should-route: ${{ steps.decide.outputs.should-route }}
    steps:
      - name: Decide whether to invoke the router
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Only pull_request events need gating — every other trigger
          # (issues, issue_comment, pull_request_review, check_suite) is
          # unaffected by this fix and always routes.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "should-route=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # groundnuty/macf#1363: Dependabot-triggered pull_request runs
          # get an EMPTY secrets context by GitHub design, so the route
          # job secrets: block fails to compose regardless of ACTION —
          # skip routing for every dependabot[bot]-actor pull_request
          # event (opened, ready_for_review, synchronize alike) rather
          # than let composition fail. An undetermined actor falls
          # through to the routable branches below: failing open on
          # ROUTING is safe, failing open on SECRETS is not.
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "should-route=false" >> "$GITHUB_OUTPUT"
            echo "skip: dependabot[bot] actor on a pull_request event — no repository-secrets access (#1363)"
            exit 0
          fi

          # opened + ready_for_review: always route, unconditionally.
          if [ "$ACTION" != "synchronize" ]; then
            echo "should-route=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # synchronize: recovery-only. Route only if no PRIOR pull_request-
          # triggered "Agent Router" run exists for this branch, EXCLUDING
          # the run this step is itself executing in (that run already
          # appears in `gh run list` — without excluding RUN_ID the query
          # always finds >=1 and the gate would ALWAYS suppress, permanently
          # defeating the recovery path this fix exists to restore).
          PRIOR_COUNT=$(gh run list --repo "$REPO" --workflow agent-router.yml \
            --branch "$HEAD_REF" --event pull_request --json databaseId \
            | jq --arg run_id "$RUN_ID" '[.[] | select((.databaseId | tostring) != $run_id)] | length')

          if [ "${PRIOR_COUNT:-0}" -gt 0 ]; then
            echo "should-route=false" >> "$GITHUB_OUTPUT"
            echo "skip: $PRIOR_COUNT prior Agent Router run(s) already exist for branch $HEAD_REF — recovery-only semantics suppress this synchronize"
          else
            echo "should-route=true" >> "$GITHUB_OUTPUT"
            echo "route: no prior Agent Router run for branch $HEAD_REF — recovery synchronize"
          fi

  route:
    needs: gate
    if: needs.gate.outputs.should-route == 'true'
    uses: groundnuty/macf-actions/.github/workflows/agent-router.yml@v3.4.2
    with:
      project: macf
      # Profile-scoped registry (DR-006): groundnuty is a user account, so the
      # MACF registry variables live on groundnuty/groundnuty. Omit the trailing
      # /actions/variables — the reusable workflow appends it.
      registry-api-path: /repos/groundnuty/groundnuty
    # groundnuty/macf#1338: `secrets: inherit` is scoped by GitHub to "the
    # same organization or enterprise" as the reusable workflow it calls —
    # this repo and macf-actions are both in `groundnuty`, so `inherit`
    # has always worked HERE, but `macf repo-init` now generates the
    # explicit six-name form unconditionally for every v3+ non-bundle pin
    # (the form that also works for a cross-org caller, which this repo
    # isn't). Switched here too so the generator and this committed file
    # stay byte-identical (see repo-init.test.ts's drift-detector) — same
    # six repo secrets, read explicitly by name instead of via the
    # `inherit` shorthand; no behavior change for this repo.
    secrets:
      MACF_ROUTING_APP_ID: ${{ secrets.MACF_ROUTING_APP_ID }}
      MACF_ROUTING_APP_KEY: ${{ secrets.MACF_ROUTING_APP_KEY }}
      ROUTING_CLIENT_CERT: ${{ secrets.ROUTING_CLIENT_CERT }}
      ROUTING_CLIENT_KEY: ${{ secrets.ROUTING_CLIENT_KEY }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
