name: Agent Router

# Delegates to the reusable workflow in groundnuty/macf-actions@v3.4.2
# (see https://github.com/groundnuty/macf-actions for source).
#
# Stage-3 (registry-driven mTLS channels) per DR-027 (ratified) — supersedes
# the #273 permanent-Stage-2 directive. The router resolves each agent's
# host+port from the MACF registry (profile scope: `groundnuty` is a user
# account, so the registry lives at groundnuty/groundnuty per DR-006) and
# POSTs `issue_routed` to the agent's channel server over mTLS, instead of
# the v1.x SSH/tmux inject. Mirrors the devops-toolkit caller (flipped
# 2026-06-25, devops-toolkit#112). Revert is a one-line pin flip
# @v3.4.1 -> @v1.3.4 (the v1.x SSH path stays available). See macf#562.
#
# Pinned to immutable v3.4.1 rather than the floating @v3 tag so the
# routing infrastructure macf itself depends on doesn't move without
# an explicit PR here. When macf-actions cuts a new release, upgrade
# the `uses:` ref by a dedicated PR on this repo — that gives the
# upgrade its own review+verify window.

on:
  issues:
    types: [labeled, closed]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]
  pull_request_review:
    types: [submitted]
  # Also feeds route-by-pr-review-state (macf-actions#432, v1.3.2+): an
  # approved / changes_requested review notifies the PR author in their
  # tmux session, so a `gh pr review` reaches the implementer without a
  # manual @mention. No `on:`/permissions change — already declared above.
  # CI-completion routing (macf-actions#6, v1.3+). Fires the
  # route-by-ci-completion job so agent-authored PRs get notified
  # when CI finishes, eliminating the "post handoff + poll" pattern.
  check_suite:
    types: [completed]

# Caller must grant at least what the reusable workflow expects.
# `checks: read` is required for the CI-completion job to enumerate
# check_runs (for the first-failing-check name) — without it the job
# would 403 inside the reusable workflow.
permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

jobs:
  route:
    uses: groundnuty/macf-actions/.github/workflows/agent-router.yml@v3.4.2
    with:
      project: macf
      # Profile-scoped registry (DR-006): groundnuty is a user account, so the
      # MACF registry variables live on groundnuty/groundnuty. Omit the trailing
      # /actions/variables — the reusable workflow appends it.
      registry-api-path: /repos/groundnuty/groundnuty
    secrets: inherit
