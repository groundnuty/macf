name: CI

on:
  push:
    branches: [main]
    paths: ['packages/**', 'package.json', 'package-lock.json', 'dev.mk', 'devbox.json']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Retrying wrapper around jetify-com/devbox-install-action@v0.15.0 —
      # its unconditional Nix-installer download 503s intermittently
      # against an upstream unrelated to the devbox-version pin below.
      # See .github/actions/devbox-install/action.yml + macf#879.
      - uses: ./.github/actions/devbox-install
        with:
          devbox-version: '0.16.0'  # pin: 0.17.x ships a require()-in-ESM helper that crashes in our "type":"module" repo (no-floating-tags directive)

      - name: Build, lint, and test
        run: make -f dev.mk check

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Lint commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5

  # DR-citation enforcement (groundnuty/macf#998). Repo-local to
  # groundnuty/macf — NOT distributed to consumer fleets (they don't carry
  # design/decisions/*.md); see the scripts' own headers. The diff check
  # needs both PR endpoints reachable in history, hence fetch-depth: 0,
  # same as the commitlint job above.
  dr-citations:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: DR citation — state check (every citation resolves to a real test)
        run: bash packages/macf/scripts/check-dr-citations.sh

      - name: DR citation — diff check (a citation can't be stripped while its amendment survives)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash packages/macf/scripts/check-dr-citations-diff.sh "$BASE_SHA" "$HEAD_SHA"
