name: Route Receipt Reconciler

# Piece 4 of Option D (groundnuty/macf#444): the consumer that turns a MISSING
# `turn_processed` span into a structural alert (emission ≠ surfacing). It joins
# the macf-actions router's delivered routes (run logs) against the substrate
# UserPromptSubmit hook's `turn_processed` spans (Tempo) on `(run_id, agent)`;
# a delivered route with no matching span past the open-threshold is a DROP
# (#437's send≠receipt gap, now observable).
#
# ── DORMANT UNTIL ROLLOUT (false-alarm guard) ────────────────────────────────
# The job is gated on `vars.RECONCILER_ENABLED == 'true'`. Until the rollout
# lands (piece-1 marker released in macf-actions + piece-2 hook synced to the
# substrate workspaces + a relaunch), the router IS delivering but NO
# `turn_processed` spans exist yet → the reconciler would flag EVERY delivery as
# a drop (false-alarm spam). So it ships OFF. The operator enables it at rollout
# by setting the repo variables:
#   RECONCILER_ENABLED   = true
#   TEMPO_QUERY_ENDPOINT = http://<tailnet-reachable-tempo-host>:13200
#   RECONCILER_SINCE     = <hook-go-live ISO-8601, e.g. 2026-06-06T08:00:00Z>
# (and optionally OPEN_THRESHOLD_MIN / LOOKBACK_MIN / TEMPO_LIMIT).
#
# ── DEPLOYMENT-BOUNDARY CUTOFF (RECONCILER_SINCE) ────────────────────────────
# Set RECONCILER_SINCE to the moment the receipt mechanism went live (the fleet
# relaunch onto the v1.3.4 router + the UserPromptSubmit hook). Routes delivered
# BEFORE that had no marker and hit hookless sessions → no `turn_processed`
# receipt by construction → a missing receipt there is EXPECTED, not a drop. The
# reconciler ignores pre-cutoff routes, so the FIRST run after enabling doesn't
# false-alarm on every pre-deployment route still inside the lookback window
# (macf#444). Self-obsoletes once LOOKBACK_MIN slides fully past the cutoff
# (~LOOKBACK_MIN after relaunch); leaving it set is harmless. Unset ⇒ no cutoff.
#
# ── ALERT-ONLY, NO AUTO-REDELIVER (Instance-6 guard) ─────────────────────────
# On a drop the workflow opens/append a `blocked` incident and @mentions the
# COORDINATOR (science-agent) to investigate — it must NEVER @mention the
# dropped *recipient* agent, because that would fire route-by-mention and
# auto-redeliver the ping (silent-fallback Instance 6 cross-agent loop). Re-
# delivery, if ever wanted, is a deliberate human step off the incident.
#
# Open-on-absence / self-close-on-appearance (e2e.yml #166/#163 shape): while
# drops exist the incident stays open; once a late span lands (busy agent) or
# none remain, the next run reports drops=0 and self-closes.
#
# ── TEMPO PROBLEM = TRUE NO-OP (Pattern A) ───────────────────────────────────
# A Tempo problem (unreachable / HTTP error / result hitting the query limit =
# truncation) makes the PROCESSED set UNKNOWABLE, NOT "zero drops". The
# reconciler emits `tempo_ok=false` in that case, and BOTH the open and the
# self-close steps are gated on `tempo_ok == 'true'`. So a Tempo problem leaves
# incidents exactly as they are: it never false-OPENS on a truncated set (which
# reads as missing receipts) and never false-CLOSES a real incident on a
# transient outage. Only a verified-complete query opens (real drops) or closes.
#
# ── DELIVERED TRUNCATION = TRUE NO-OP (Pattern A, delivered side; macf#462) ───
# Symmetric guard on the OTHER set: if `gh run list` hits its run cap the
# DELIVERED set is truncated (older routes fell off the page) → also UNKNOWABLE.
# The reconciler emits `delivered_ok=false`, and both steps additionally gate on
# `delivered_ok == 'true'`, so a truncated delivered set is a true no-op too
# (silently bounding coverage would let a real drop hide). LOOKBACK_MIN defaults
# to 120 to keep the window below the router's cap-exceeding volume.
#
# ── COALESCED-TURN SUPPRESSION = LOUD, NEVER SILENT (macf#479 precision floor) ─
# A receipt is per-RUN, not per-turn: two routed pings that arrive ~seconds apart
# can coalesce/clobber into ONE turn, which emits ONE `turn_processed` span for
# ONE of the run_ids — the sibling looks like a drop though the agent was alive
# and processed the turn (#34 receipt≠distinct-turn Gap-2; #462's lone drops=1).
# The reconciler SUPPRESSES such a would-be drop only when a *receipted* sibling
# delivery to the SAME agent sits within ±PROXIMITY_MIN (proof the agent was
# processing routed turns then). A real lone/offline/RC-bound drop has NO
# receipted sibling, so it still flags (the #437 cause-3 teeth are preserved).
# Suppressions are emitted LOUD + counted (`suppressed_coalesced_drop` run-log
# lines + `suppressed_count` output) and surfaced in the self-close comment, so a
# self-close is always clean-for-the-RIGHT-reason — never a silent mask. The
# residual content-loss clobber is closed at the root by the source-side
# C-u-clobber fix (tracked separately); the suppressed-rate signal keeps it
# visible until then.
#
# Security: github.* context goes through `env:`, never inline `${{ }}` in run:.

on:
  schedule:
    # Every 15 min — aligned with the ~15 min open-threshold (a busy agent's
    # late turn is still "in flight" within the threshold, not yet a drop).
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    # Dormant until the operator enables it post-rollout (see header).
    if: vars.RECONCILER_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      # Shared by the reconcile, open, and self-close steps so the dedup
      # title-prefix stays in lockstep (same discipline as e2e.yml).
      INCIDENT_TITLE_PREFIX: "routing: dropped ping (no turn_processed receipt)"
    steps:
      - uses: actions/checkout@v7

      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          devbox-version: '0.16.0'  # pin: 0.17.x ships a require()-in-ESM helper that crashes in our "type":"module" repo (no-floating-tags directive)

      - name: Install + build (compiles dist/reconciler/run.js)
        run: |
          make -f dev.mk install
          make -f dev.mk build

      # Tailscale is brought up LAST — only the reconcile step needs the tailnet
      # (to reach Tempo's query API). Connecting earlier broke the Nix installer
      # download in devbox-install-action (`tailscale up` rewrites DNS/routing →
      # the installer's CDN fetch 502'd, deterministically). Keeping it here also
      # minimizes the tailnet-open window to just the query.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # Must match a tag the OAuth client owns + the tailnet ACL's tagOwners
          # (`tag:ci-runner`). An unowned tag (was `tag:ci`) → `tailscale up`
          # 400s "requested tags … invalid or not permitted" on every retry.
          tags: tag:ci-runner

      # Fail LOUD if the tailnet isn't actually up. tailscale/github-action exits
      # 0 even after exhausting all retries (e.g. an invalid `tags:` 400s 5×),
      # so without this the reconcile step would run off-tailnet and report a
      # misleading `tempo_ok=false` forever — a silent degradation. Assert the
      # backend is Running so a tag/auth regression surfaces as a red job, not a
      # quietly-never-reconciling green one.
      - name: Verify tailnet is up
        run: |
          set -euo pipefail
          state=$(tailscale status --json 2>/dev/null | jq -r '.BackendState // "Unknown"')
          echo "Tailscale BackendState: ${state}"
          if [ "${state}" != "Running" ]; then
            echo "::error::Tailscale not connected (BackendState=${state}). The reconciler can't reach Tempo. Check the workflow's tags: input matches the OAuth client + ACL tagOwners (tag:ci-runner)."
            exit 1
          fi

      - name: Reconcile delivered routes vs turn_processed receipts
        id: reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECONCILER_REPO: ${{ github.repository }}
          ROUTER_WORKFLOW: agent-router.yml
          TEMPO_QUERY_ENDPOINT: ${{ vars.TEMPO_QUERY_ENDPOINT }}
          OPEN_THRESHOLD_MIN: ${{ vars.OPEN_THRESHOLD_MIN || '15' }}
          LOOKBACK_MIN: ${{ vars.LOOKBACK_MIN || '120' }}
          TEMPO_LIMIT: ${{ vars.TEMPO_LIMIT || '1000' }}
          # macf#479 coalesced-turn gate: suppress a would-be drop when a receipted
          # sibling delivery to the same agent is within ±this. Must be < the
          # open-threshold so real lone/offline/RC-bound drops still flag. 0 = off.
          PROXIMITY_MIN: ${{ vars.PROXIMITY_MIN || '5' }}
          # Deployment-boundary cutoff — ignore routes that predate the receipt
          # mechanism's go-live (no marker / no hook → no receipt by construction,
          # not a drop). Set to the relaunch time at the first flip (see header).
          RECONCILER_SINCE: ${{ vars.RECONCILER_SINCE }}
        run: node packages/macf/dist/reconciler/run.js

      # Open-on-absence. Alert-only: @mention the COORDINATOR (science-agent),
      # NEVER the dropped recipient agent (route-by-mention would auto-redeliver
      # — Instance-6 hazard).
      - name: Open / update incident on dropped pings
        # tempo_ok gate: a Tempo problem (unreachable / HTTP error / truncated)
        # emits tempo_ok=false → neither open NOR close runs (true no-op). Only a
        # verified-complete query with real drops opens. Avoids false-OPEN on a
        # truncated PROCESSED set (Pattern A).
        if: steps.reconcile.outputs.tempo_ok == 'true' && steps.reconcile.outputs.delivered_ok == 'true' && steps.reconcile.outputs.drops_count != '0' && steps.reconcile.outputs.drops_count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DROPS_COUNT: ${{ steps.reconcile.outputs.drops_count }}
          DROPS_JSON: ${{ steps.reconcile.outputs.drops_json }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "\"$INCIDENT_TITLE_PREFIX\" in:title" --json number --jq '.[0].number // ""')

          # Render the dropped (run_id, agent) pairs as a list with run links.
          DROP_LINES=$(printf '%s' "$DROPS_JSON" | jq -r \
            --arg base "${{ github.server_url }}/${{ github.repository }}/actions/runs" \
            '.[] | "- agent `\(.agent)` — route run [\(.runId)](\($base)/\(.runId))"')

          BODY=$(cat <<EOF
          The route-receipt reconciler found **$DROPS_COUNT** delivered route(s) with no \`turn_processed\` receipt past the open-threshold — a ping the router logged as delivered that never became a turn (#437 send≠receipt gap / #444-D).

          $DROP_LINES

          Reconcile run: $RUN_URL

          @macf-science-agent[bot] — routing drop detected; please investigate (the recipient agent may be offline, RC-bound, or its receipt hook not emitting). **Not auto-redelivered** (Instance-6 guard); re-route deliberately if needed. This incident **auto-closes** when a later reconcile finds the receipt (busy-agent late turn) or no remaining drops.
          EOF
          )

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
            echo "Updated incident #$EXISTING"
          else
            gh issue create --repo "$REPO" \
              --title "$INCIDENT_TITLE_PREFIX" \
              --label "science-agent,blocked" \
              --body "$BODY"
          fi

      # Self-close-on-appearance: no drops this run ⇒ the receipt landed (or none
      # outstanding) ⇒ close any open incident. Schedule/dispatch only (a genuine
      # reconcile pass).
      - name: Self-close incident when no drops remain
        # tempo_ok gate: only self-close on a VERIFIED-complete zero — never
        # close a real incident just because Tempo was briefly unreachable /
        # errored / truncated this run (that would false-CLOSE; Pattern A).
        if: steps.reconcile.outputs.tempo_ok == 'true' && steps.reconcile.outputs.delivered_ok == 'true' && steps.reconcile.outputs.drops_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUPPRESSED_COUNT: ${{ steps.reconcile.outputs.suppressed_count }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "\"$INCIDENT_TITLE_PREFIX\" in:title" --json number --jq '.[0].number // ""')
          if [ -z "$EXISTING" ]; then echo "No open routing-drop incident — no-op."; exit 0; fi
          # macf#479: a "clean" run that silently masked a suppressed would-be-drop
          # is clean-for-the-WRONG-reason. If this run suppressed benign coalesced
          # turns, SAY SO in the close comment so the operator-facing surface
          # matches the run log's `suppressed_coalesced_drop` lines (loud + counted,
          # never a silent mask). Default note covers the all-receipts-landed case.
          REASON_NOTE=" (all delivered routes have \`turn_processed\` receipts)"
          if [ -n "${SUPPRESSED_COUNT:-}" ] && [ "${SUPPRESSED_COUNT}" != "0" ]; then
            REASON_NOTE=" (${SUPPRESSED_COUNT} would-be drop(s) suppressed as benign coalesced turns — a receipted sibling delivery to the same agent within the proximity window proves the agent was processing routed turns then, macf#479; per-route detail in the run log's \`suppressed_coalesced_drop\` lines)"
          fi
          gh issue close "$EXISTING" --repo "$REPO" --reason completed \
            --comment "Reconcile found no outstanding dropped pings${REASON_NOTE}. Auto-closed; re-opens via title-prefix dedup if a drop recurs. Run: $RUN_URL"
          echo "Closed incident #$EXISTING"
