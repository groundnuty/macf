name: 'devbox install (retrying)'
description: >-
  Wraps jetify-com/devbox-install-action with a bounded, backed-off retry.
  The wrapped action's own "Get devbox version" step is a no-op network-wise
  once devbox-version is pinned (it just echoes the pin, no curl) — but its
  LATER "Download and install experimental Nix installer" step is
  unconditional every run and fetches
  https://artifacts.nixos.org/experimental-installer with no retry of its
  own. That fetch periodically 503s (macf#879), killing the job ~8-10s in
  before any build/test step runs, on a cause unrelated to the devbox
  version pin. Retrying the *whole* composite step is cheap on the happy
  path (a cache-hit devbox-cli restore, ~1s) because a transient upstream
  outage recovers within a run or two — confirmed empirically: PR #875
  needed 3 attempts, PR #876 needed 2, both against the exact same
  curl-503-from-artifacts.nixos.org signature.
  A genuine persistent failure (bad version pin, checksum mismatch, a real
  extended outage) still fails the job LOUD after all attempts are
  exhausted — see the final attempt (no continue-on-error), the
  "Verify devbox is present" step (asserts the actual result-invariant
  rather than trusting the wrapped action's exit code), and the
  "devbox install exhausted all attempts" step (fires only on exhaustion,
  since the verify step above it is skipped once the job has already
  failed — a step gated on `if: failure()` is required to say anything
  at all on that path). Silent-fallback-hazards.md Instance 11 is the
  canonical write-up of the exit-0-despite-exhausted-retries shape; the
  verify step is that instance's Pattern-A defense, applied here
  proactively rather than after an incident.

  Scope of what retrying recovers: all 3 confirmed real-world failures
  (PR #875 x2, PR #876 x1) happened at the SAME point — the curl fetch of
  the Nix installer itself, before Nix ever lands — so a from-scratch
  retry is clean in the observed failure mode. This action does NOT pass
  `--force` to the wrapped Nix installer, so a hypothetical failure
  *after* Nix is successfully installed within the same attempt (e.g. a
  cache.nixos.org hiccup during package installation) is a different,
  unverified scenario: nix-installer's own `--force` flag description
  ("forcibly recreate files it finds existing") implies a plain re-run
  against an existing `/nix` may error rather than cleanly retry. Not
  fixed here — the observed failure class doesn't exercise that path, and
  adding `--force` unconditionally has its own blast-radius questions this
  issue didn't ask to solve. If a future failure IS observed past the
  Nix-installer step, revisit this scope note before assuming the retry
  still helps.

inputs:
  devbox-version:
    description: 'devbox CLI version to pin to (forwarded verbatim to jetify-com/devbox-install-action)'
    required: true
  project-path:
    description: 'Project path to devbox.json (forwarded verbatim)'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: devbox install attempt 1/3
      id: attempt1
      uses: jetify-com/devbox-install-action@v0.15.0
      continue-on-error: true
      with:
        devbox-version: ${{ inputs.devbox-version }}
        project-path: ${{ inputs.project-path }}

    - name: back off before attempt 2/3
      if: steps.attempt1.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::devbox-install-action attempt 1/3 failed (see the failed step's log above for the actual error) — retrying after a 5s backoff."
        sleep 5

    - name: devbox install attempt 2/3
      id: attempt2
      if: steps.attempt1.outcome == 'failure'
      uses: jetify-com/devbox-install-action@v0.15.0
      continue-on-error: true
      with:
        devbox-version: ${{ inputs.devbox-version }}
        project-path: ${{ inputs.project-path }}

    - name: back off before attempt 3/3
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::devbox-install-action attempt 2/3 failed (see the failed step's log above for the actual error) — retrying after a 15s backoff."
        sleep 15

    # No continue-on-error here: exhausting all 3 attempts must fail the
    # job LOUD, never silently skip the caller's next step (macf#879 AC).
    - name: devbox install attempt 3/3
      id: attempt3
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      uses: jetify-com/devbox-install-action@v0.15.0
      with:
        devbox-version: ${{ inputs.devbox-version }}
        project-path: ${{ inputs.project-path }}

    # Result-invariant assert (Pattern A, silent-fallback-hazards.md
    # Instance 11): a third-party action reporting outcome=success is not
    # proof devbox is actually usable. Cheap and never previously observed
    # to fail here, but the whole point of Instance 11 is that "never
    # observed to fail (yet)" is not the same as "can't happen" — assert
    # the thing the install step was supposed to establish, don't just
    # trust its exit code.
    - name: verify devbox is present and runnable
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v devbox >/dev/null 2>&1; then
          echo "::error::devbox is not on PATH after the install step(s) above reported success."
          echo "::error::This is the silent-fallback-hazards.md Instance 11 shape: a third-party"
          echo "::error::action can exhaust its own retries and still exit 0. Check the attempt"
          echo "::error::logs above for the literal failure (curl exit code / HTTP status) to tell"
          echo "::error::a transient upstream outage from a persistent one (bad version pin,"
          echo "::error::checksum mismatch, action regression). See macf#879."
          exit 1
        fi
        echo "devbox on PATH: $(command -v devbox)"
        devbox version

    # Runs ONLY on genuine install exhaustion. `if: failure()` fires
    # regardless of the normal skip-on-prior-failure semantics that would
    # otherwise skip every remaining step once attempt 3 fails without
    # continue-on-error — that part IS needed, since without it this step
    # never runs at all (the "verify devbox is present" step above is
    # skipped once the job has failed, so *something* gated on failure()
    # is required to say anything on this path). But `failure()` alone is
    # too broad: it also goes true if the "verify devbox is present" step
    # ABOVE fails on its own (attempt 1 succeeded, devbox still absent —
    # the actual Instance-11 shape) — that step already prints its own
    # accurate diagnosis, and this step firing too would wrongly claim
    # "ALL 3 attempts failed" when only attempt 1 ran. The extra conjunct
    # scopes this step to the one case its message is actually true for:
    # attempt 3 itself failed (checked via .conclusion, not .outcome, per
    # GitHub's own canonical `failure() && steps.<id>.conclusion == ...`
    # pattern for this exact "failure with conditions" case — attempt3 has
    # no continue-on-error so outcome and conclusion agree here regardless,
    # but conclusion is the documented-correct property to check).
    - name: devbox install exhausted all attempts
      if: failure() && steps.attempt3.conclusion == 'failure'
      shell: bash
      run: |
        echo "::error::devbox-install-action failed on ALL 3 attempts."
        echo "::error::IGNORE the 'nix has shipped a backwards incompatible change ..."
        echo "::error::delete the cache' hint printed above once per failed attempt --"
        echo "::error::that diagnosis is almost always wrong (see macf#879) and the"
        echo "::error::cache is very likely fine; deleting it costs every later run a"
        echo "::error::cold rebuild for no benefit."
        echo "::error::Scroll up to each attempt's OWN curl/exit-code line for the real"
        echo "::error::failure. The same 503 from https://artifacts.nixos.org (or"
        echo "::error::releases.jetify.com) on all 3, spread over ~20s of backoff,"
        echo "::error::usually means a short-lived upstream outage -- re-run the job in"
        echo "::error::a few minutes. A different failure shape on a later attempt (non-503"
        echo "::error::HTTP status, checksum mismatch, 'version not found') is likely"
        echo "::error::persistent, not transient -- re-running the job won't help; fix the"
        echo "::error::underlying cause (see this action's header comment on retry scope)."
        exit 1
